name: macOS public download check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Compare public HTTPS clients without credentials
        run: python3 scripts/runtime/probe_network.py
