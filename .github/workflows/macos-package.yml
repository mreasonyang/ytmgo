name: macOS package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Package signing (unsigned is for build testing only)
        required: true
        default: notarized
        type: choice
        options:
          - unsigned
          - developer-id
          - notarized
      release_version:
        description: Optional version override (for example 0.6.1-rc.1; patch 0-999, no leading zeros)
        required: false
        type: string
      publish_release:
        description: Publish the notarized package and signed update feed to GitHub Releases
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Keep the tested commit referenced even if main advances during builds.
      # GitHub requires workflow scope for an unreferenced workflow-changing SHA.
      - name: Configure and pin formal release source
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PACKAGE_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/publish.py configure
          python3 scripts/release/publish.py pin-source
  build:
    needs: source
    if: github.ref == 'refs/heads/main'
    name: Native build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    env:
      CGO_ENABLED: "0"
      CARGO_BUILD_JOBS: "2"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PACKAGE_MODE: ${{ inputs.mode }}
        run: python3 scripts/release/publish.py configure
      - name: Test packaging and license gates
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          make test-licenses test-login
      - name: Go tests and vet
        run: |
          make test
          go vet ./...
          go tool mygo i18n check
      - name: Build complete native app with locked runtime
        run: make build-app
      - name: Test bundled media runtime
        run: |
          python3 scripts/runtime/test_runtime_manifest.py
          python3 scripts/runtime/test_protocol_version.py
          python3 scripts/runtime/run_tests.py
      - name: Inspect deployment targets and smoke native build
        run: |
          python3 scripts/release/macos_compat.py --app build/darwin-${{ matrix.arch }}/ytmGO.app --arch ${{ matrix.arch }} --smoke --receipt dist/receipts/build-${{ matrix.arch }}.json
          ditto -c -k --keepParent build/darwin-${{ matrix.arch }}/ytmGO.app dist/app-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-app-${{ matrix.arch }}
          path: |
            dist/app-${{ matrix.arch }}.zip
            dist/receipts/build-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  package:
    needs: build
    # Native builders receive no signing credentials. Only this protected job does.
    environment: macos-release
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: native-app-*
          path: dist/native
          merge-multiple: true
      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PACKAGE_MODE: ${{ inputs.mode }}
        run: python3 scripts/release/publish.py configure
      - name: Restore and inspect both native bundles
        run: |
          for arch in arm64 amd64; do
            mkdir -p "build/darwin-$arch"
            ditto -x -k "dist/native/app-$arch.zip" "build/darwin-$arch"
            python3 scripts/release/macos_compat.py --app "build/darwin-$arch/ytmGO.app" --arch "$arch" --receipt "dist/receipts/unsigned-$arch.json"
          done
          go build -o build/release/update-package ./cmd/update-package
      - name: Package unsigned test builds
        if: inputs.mode == 'unsigned'
        run: |
          for arch in arm64 amd64; do
            python3 scripts/release/macos.py package --mode unsigned --arch "$arch" --out "dist/macos-$arch"
          done
      - name: Sign and optionally notarize both native builds
        if: inputs.mode != 'unsigned'
        env:
          PACKAGE_MODE: ${{ inputs.mode }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          for arch in arm64 amd64; do
            python3 scripts/release/macos.py package --mode "$PACKAGE_MODE" --arch "$arch" --out "dist/macos-$arch"
          done
      - name: Remove temporary signing materials
        if: always()
        run: python3 scripts/release/macos.py cleanup
      - name: Assemble immutable dual architecture asset set
        run: python3 scripts/release/assemble_macos.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ytmgo-macos-${{ inputs.mode }}-${{ github.run_number }}
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  acceptance:
    needs: package
    name: Signed native startup (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ytmgo-macos-${{ inputs.mode }}-${{ github.run_number }}
          path: dist/macos
      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release/publish.py configure
      - name: Native installed app and helper startup
        env:
          ARCH: ${{ matrix.arch }}
          MODE: ${{ inputs.mode }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          archive="dist/macos/ytmgo-$version-$ARCH-$MODE.zip"
          (cd dist/macos && shasum -a 256 -c SHA256SUMS)
          ditto -x -k "$archive" /Applications
          flags=()
          if [ "$MODE" = notarized ]; then flags+=(--signed); fi
          python3 scripts/release/macos_compat.py --app /Applications/ytmGO.app --arch "$ARCH" --smoke "${flags[@]}" --archive "$archive" --receipt "dist/receipts/signed-$ARCH.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-acceptance-${{ matrix.arch }}
          path: dist/receipts/signed-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    needs: acceptance
    if: inputs.publish_release
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ytmgo-macos-${{ inputs.mode }}-${{ github.run_number }}
          path: dist/macos
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: native-acceptance-*
          path: dist/receipts
          merge-multiple: true
      - name: Verify both native acceptances and publish
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PACKAGE_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/publish.py configure
          go build -o build/release/update-package ./cmd/update-package
          python3 scripts/release/publish.py publish
