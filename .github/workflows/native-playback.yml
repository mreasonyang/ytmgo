name: Native playback runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: Platform to validate (all preserves the automatic three-platform matrix)
        required: false
        default: all
        type: choice
        options:
          - all
          - xcode-27
          - macos-latest
          - windows-latest
          - ubuntu-24.04
      test_count:
        description: Offline protocol test repetitions
        required: false
        default: "1"
        type: choice
        options: ["1", "3", "5"]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # Match the ARM image that builds and accepts the signed macOS release.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != '' && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["xcode-27","windows-latest","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system WebView and native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config nasm libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev xvfb xauth dbus-x11
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: make diffutils mingw-w64-ucrt-x86_64-gcc
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/runtime/prepare.py
      - name: Prepare Unix runtime
        if: runner.os != 'Windows'
        run: python scripts/runtime/prepare.py
      - name: Verify package closure
        run: |
          python scripts/runtime/prepare.py --verify
          python -m unittest discover -s scripts/runtime -p "test_*.py"
          python -m unittest discover -s scripts/licensing -p "test_*.py"
          go build -o build/native-playback-app-check .
      - name: Offline native protocol and lifecycle tests
        if: runner.os != 'Linux'
        run: python scripts/runtime/run_tests.py --count ${{ inputs.test_count || '1' }}
      - name: Offline native protocol and lifecycle tests with Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python scripts/runtime/run_tests.py --count ${{ inputs.test_count || '1' }}
      # Never add real accounts, media playback or live API tests to this job.
