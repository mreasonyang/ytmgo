[package]
name = "ytmgo-account-login"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
# Builds a fixed, offline synthetic page for UI lifecycle tests. Never package it.
fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.37.1"
url = "2"
wry = "=0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
