[package]
name = "ytmgo-playback-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.37.1"
wry = "=0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSURL"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
webview2-com = "=0.39.1"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
